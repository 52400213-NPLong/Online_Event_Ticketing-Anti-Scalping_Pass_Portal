<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập | Pass Portal</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
    <style>
      body {
        min-height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      .auth-card {
        width: 100%;
        max-width: 420px;
        background: linear-gradient(180deg, rgba(15, 23, 42, 0.94), rgba(15, 23, 42, 0.82));
        border: 1px solid var(--border);
        border-radius: 22px;
        padding: 30px 28px;
        box-shadow: var(--shadow);
      }

      .auth-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        background: rgba(2, 6, 23, 0.65);
        padding: 6px;
        border-radius: 14px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        margin-bottom: 22px;
      }

      .auth-tab-btn {
        padding: 11px 14px;
        border-radius: 10px;
        border: none;
        background: transparent;
        color: var(--muted);
        font-weight: 700;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .auth-tab-btn.active {
        background: linear-gradient(135deg, var(--primary), #a78bfa);
        color: #ffffff;
        box-shadow: 0 8px 20px rgba(124, 58, 237, 0.28);
      }

      .auth-alert {
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 0.9rem;
        margin-bottom: 16px;
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="auth-card">
      <div class="auth-tabs">
        <button id="tabLoginBtn" class="auth-tab-btn active" type="button">Đăng nhập</button>
        <button id="tabRegisterBtn" class="auth-tab-btn" type="button">Đăng ký</button>
      </div>

      <div id="authAlert" class="auth-alert"></div>

      <!-- FORM ĐĂNG NHẬP -->
      <form id="loginForm">
        <div class="form-field">
          <label for="loginEmail">Email</label>
          <input id="loginEmail" type="email" placeholder="Nhập email..." autocomplete="username" required />
        </div>

        <div class="form-field">
          <label for="loginPassword">Mật khẩu</label>
          <input id="loginPassword" type="password" placeholder="Nhập mật khẩu..." autocomplete="current-password" required />
        </div>

        <button id="loginSubmitBtn" type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Đăng nhập
        </button>
      </form>

      <!-- FORM ĐĂNG KÝ -->
      <form id="registerForm" style="display: none;">
        <div class="form-field">
          <label for="regFullName">Họ và tên</label>
          <input id="regFullName" type="text" placeholder="Nhập họ và tên..." autocomplete="name" required />
        </div>

        <div class="form-field">
          <label for="regEmail">Email</label>
          <input id="regEmail" type="email" placeholder="Nhập email..." autocomplete="email" required />
        </div>

        <div class="form-field">
          <label for="regPassword">Mật khẩu</label>
          <input id="regPassword" type="password" placeholder="Tối thiểu 8 ký tự..." minlength="8" autocomplete="new-password" required />
        </div>

        <button id="regSubmitBtn" type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
          Đăng ký
        </button>
      </form>
    </div>

    <script src="../js/auth.js"></script>
    <script>
      (function () {
        const API_BASE = window.location.origin.includes('http')
          ? window.location.origin
          : 'http://localhost:5000';

        const tabLoginBtn = document.getElementById('tabLoginBtn');
        const tabRegisterBtn = document.getElementById('tabRegisterBtn');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const authAlert = document.getElementById('authAlert');

        const params = new URLSearchParams(window.location.search);
        if (params.get('tab') === 'register') {
          switchTab('register');
        }

        function switchTab(mode) {
          hideAlert();
          if (mode === 'register') {
            tabRegisterBtn.classList.add('active');
            tabLoginBtn.classList.remove('active');
            registerForm.style.display = 'block';
            loginForm.style.display = 'none';
          } else {
            tabLoginBtn.classList.add('active');
            tabRegisterBtn.classList.remove('active');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
          }
        }

        tabLoginBtn.addEventListener('click', () => switchTab('login'));
        tabRegisterBtn.addEventListener('click', () => switchTab('register'));

        function showAlert(type, msg) {
          authAlert.style.display = 'block';
          if (type === 'error') {
            authAlert.style.background = 'rgba(239, 68, 68, 0.15)';
            authAlert.style.border = '1px solid rgba(239, 68, 68, 0.45)';
            authAlert.style.color = '#fecaca';
          } else {
            authAlert.style.background = 'rgba(34, 197, 94, 0.15)';
            authAlert.style.border = '1px solid rgba(34, 197, 94, 0.45)';
            authAlert.style.color = '#bbf7d0';
          }
          authAlert.textContent = msg;
        }

        function hideAlert() {
          authAlert.style.display = 'none';
        }

        function redirectAfterAuth(session) {
          window.location.href = window.PassPortalAuth.getRoleHomePage(session.role);
        }

        loginForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideAlert();

          const email = document.getElementById('loginEmail').value.trim();
          const password = document.getElementById('loginPassword').value;
          const btn = document.getElementById('loginSubmitBtn');

          btn.disabled = true;
          btn.textContent = 'Đang xử lý...';

          try {
            const res = await fetch(`${API_BASE}/api/v1/auth/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });

            const data = await res.json();
            if (!res.ok) {
              showAlert('error', data.message || 'Đăng nhập thất bại.');
              return;
            }

            const session = window.PassPortalAuth.saveSession(data);
            redirectAfterAuth(session);
          } catch {
            showAlert('error', 'Không thể kết nối máy chủ API.');
          } finally {
            btn.disabled = false;
            btn.textContent = 'Đăng nhập';
          }
        });

        registerForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          hideAlert();

          const fullName = document.getElementById('regFullName').value.trim();
          const email = document.getElementById('regEmail').value.trim();
          const password = document.getElementById('regPassword').value;
          const btn = document.getElementById('regSubmitBtn');

          btn.disabled = true;
          btn.textContent = 'Đang xử lý...';

          try {
            const res = await fetch(`${API_BASE}/api/v1/auth/register`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ fullName, email, password })
            });

            const data = await res.json();
            if (!res.ok) {
              showAlert('error', data.message || 'Đăng ký thất bại.');
              return;
            }

            const session = window.PassPortalAuth.saveSession(data);
            redirectAfterAuth(session);
          } catch {
            showAlert('error', 'Không thể kết nối máy chủ API.');
          } finally {
            btn.disabled = false;
            btn.textContent = 'Đăng ký';
          }
        });
      })();
    </script>
  </body>
</html>
