version: '3.8'

services:
  webapi:
    build:
      context: .
      dockerfile: src/EventTicketing.WebApi/Dockerfile
    ports:
      - "5000:80"
    environment:
      - DYNAMIC_QR_SECRET_KEY=SuperSecretProductionKey999!
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - SA_PASSWORD=YourPassword123!
      - ACCEPT_EULA=Y